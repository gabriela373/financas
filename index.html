<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vida Gabriela</title>
<meta name="theme-color" content="#f3f4f6">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* =====================================================================
   VIDA GABRIELA — design tokens
   ===================================================================== */
:root{
  --bg:#f3f4f6; --card:#ffffff; --sub:#f5f6f8; --sub2:#eceff3;
  --tx:#0f172a; --tx2:#334155; --mu:#6b7280; --mu2:#9aa3b2;
  --ln:#eceef2; --ln2:#e2e5eb;
  --bl:#1f5fe0; --bl2:#2f6df0; --blS:#e8f0ff; --blT:#1d4fc4;
  --gr:#16a34a; --grS:#e7f7ed; --rd:#e11d48; --rdS:#ffe9ee; --am:#d97706; --amS:#fff4dc;
  --g-fixas:#1e3a8a; --g-cartao:#2563eb; --g-apto:#38bdf8; --g-fitness:#14b8a6; --g-dia:#cbd5e1; --g-reserva:#8b5cf6; --g-sobra:#22c55e;
  --sh:0 1px 2px rgba(16,24,40,.04),0 1px 3px rgba(16,24,40,.03);
  --sh2:0 12px 32px -8px rgba(16,24,40,.16),0 2px 6px rgba(16,24,40,.06);
  --side:#ffffff; --r:20px; --r2:14px;
  color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#0a0c10; --card:#13161d; --sub:#1a1e27; --sub2:#212632;
  --tx:#eef1f7; --tx2:#c3cad8; --mu:#8a93a6; --mu2:#667085;
  --ln:#212631; --ln2:#2a3040;
  --bl:#3b7bff; --bl2:#5a92ff; --blS:#172447; --blT:#8db3ff;
  --gr:#34d27b; --grS:#0f2a1c; --rd:#ff5d7d; --rdS:#33141d; --am:#fbbf24; --amS:#33270d;
  --g-fixas:#3b5bdb; --g-cartao:#3b7bff; --g-apto:#38bdf8; --g-fitness:#2dd4bf; --g-dia:#4b5568; --g-reserva:#a78bfa; --g-sobra:#34d27b;
  --sh:0 0 0 1px rgba(255,255,255,.02);
  --sh2:0 16px 40px -8px rgba(0,0,0,.6);
  --side:#10131a;
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font:14px/1.45 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--tx);min-height:100vh;-webkit-font-smoothing:antialiased;letter-spacing:-.005em}
button,input,select,textarea{font:inherit;color:inherit;letter-spacing:inherit}
button{cursor:pointer;background:none;border:0}
a{color:inherit;text-decoration:none}
svg.i{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
svg.i.s{width:15px;height:15px}svg.i.l{width:22px;height:22px}
:focus-visible{outline:2px solid var(--bl);outline-offset:2px;border-radius:8px}
::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-thumb{background:var(--ln2);border-radius:8px}::-webkit-scrollbar-track{background:transparent}
.tnum{font-variant-numeric:tabular-nums}

/* =====================================================================
   LAYOUT
   ===================================================================== */
.app{display:grid;grid-template-columns:268px minmax(0,1fr);gap:12px;padding:12px;min-height:100vh}
.side{position:sticky;top:12px;height:calc(100vh - 24px);background:var(--side);border-radius:var(--r);box-shadow:var(--sh);border:1px solid var(--ln);display:flex;flex-direction:column;padding:16px 14px 14px;overflow:hidden;z-index:40}
.brand{display:flex;align-items:center;gap:11px;padding:2px 6px 16px}
.avatar{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,#2f6df0,#1a4fc8);color:#fff;display:grid;place-items:center;font-weight:700;font-size:16px;flex:none;box-shadow:0 4px 10px -2px rgba(31,95,224,.5)}
.brand b{display:block;font-size:14px;font-weight:700;line-height:1.2}
.brand span{font-size:11.5px;color:var(--mu)}
.side-sc{flex:1;overflow-y:auto;margin:0 -6px;padding:0 6px}
.nav-h{font-size:11px;font-weight:600;color:var(--mu2);letter-spacing:.06em;text-transform:uppercase;padding:14px 10px 6px}
.nav{display:flex;align-items:center;gap:11px;width:100%;text-align:left;padding:9px 11px;border-radius:11px;color:var(--tx2);font-weight:500;font-size:13.5px;transition:background .15s,color .15s;margin-bottom:2px}
.nav svg{color:var(--mu)}
.nav:hover{background:var(--sub)}
.nav.on{background:var(--sub);color:var(--tx);font-weight:600}
.nav.on svg{color:var(--bl)}
.nav.demo{color:var(--tx2)}
.nav.demo.on{background:var(--amS);color:var(--am)}
.nav.demo.on svg{color:var(--am)}
.side-f{border-top:1px solid var(--ln);padding-top:12px;margin-top:8px;display:grid;gap:10px}
.theme{display:flex;align-items:center;justify-content:space-between;padding:0 6px;font-size:13px;color:var(--tx2);font-weight:500}
.theme .tg{display:flex;background:var(--sub);border-radius:999px;padding:3px;gap:2px}
.theme .tg button{width:30px;height:26px;border-radius:999px;display:grid;place-items:center;color:var(--mu)}
.theme .tg button.on{background:var(--card);color:var(--tx);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.me{display:flex;align-items:center;gap:10px;padding:8px 8px;border-radius:12px;width:100%;text-align:left;transition:background .15s}
.me:hover{background:var(--sub)}
.me .avatar{width:34px;height:34px;font-size:14px}
.me b{display:block;font-size:13px;font-weight:600;line-height:1.2}
.me span{font-size:11.5px;color:var(--mu);display:flex;align-items:center;gap:5px}
.me span i{width:6px;height:6px;border-radius:50%;background:var(--gr);display:inline-block}
.me span i.off{background:var(--am)}
.me svg{margin-left:auto;color:var(--mu)}

.main{min-width:0;display:flex;flex-direction:column;gap:12px}
.demo-bar{background:linear-gradient(90deg,#fff4dc,#ffeccb);color:#8a4b05;border:1px solid #f6d7a2;border-radius:var(--r2);padding:10px 14px;display:flex;align-items:center;gap:12px;font-weight:500;font-size:13px;position:sticky;top:12px;z-index:35;box-shadow:var(--sh)}
:root[data-theme="dark"] .demo-bar{background:linear-gradient(90deg,#33270d,#2d2210);color:#fcd48a;border-color:#4d3a12}
.demo-bar svg{flex:none}
.demo-bar .btn{margin-left:auto;background:#fff;color:#8a4b05;border:1px solid #f0cd92;white-space:nowrap}
:root[data-theme="dark"] .demo-bar .btn{background:#1a1408;color:#fcd48a;border-color:#4d3a12}
.top{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--ln);border-radius:var(--r);box-shadow:var(--sh);padding:13px 18px 13px 14px;min-height:64px}
.top h1{font-size:25px;font-weight:600;letter-spacing:-.02em;display:flex;align-items:baseline;gap:7px;line-height:1}
.top h1 em{font-style:normal;font-weight:400;color:var(--mu)}
.top .month{display:flex;align-items:center;gap:6px;padding:6px 8px;border-radius:12px;transition:background .15s}
.top .month:hover{background:var(--sub)}
.top .month svg{color:var(--mu);align-self:center}
.top .sp{flex:1}
.ib{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;color:var(--mu);transition:background .15s,color .15s;position:relative;flex:none}
.ib:hover{background:var(--sub);color:var(--tx)}
.ib.bord{border:1px solid var(--ln2);background:var(--card)}
.ib .bdg{position:absolute;top:-5px;right:-5px;background:var(--rd);color:#fff;font-size:10px;font-weight:700;min-width:18px;height:18px;border-radius:9px;display:grid;place-items:center;padding:0 4px;border:2px solid var(--card)}
.burger{display:none}
.split{display:flex;position:relative}
.split .btn.pri{border-radius:10px 0 0 10px;padding:9px 16px}
.split .caret{border-radius:0 10px 10px 0;background:var(--bl);color:#fff;width:38px;display:grid;place-items:center;border-left:1px solid rgba(255,255,255,.28)}
.split .caret:hover{background:var(--bl2)}

.page{display:flex;flex-direction:column;gap:16px;min-width:0}
.page.anim{animation:fade .25s ease both}
.dash{grid-auto-flow:dense}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:16px;align-items:stretch}
.s3{grid-column:span 3}.s4{grid-column:span 4}.s5{grid-column:span 5}.s6{grid-column:span 6}.s7{grid-column:span 7}.s8{grid-column:span 8}.s12{grid-column:span 12}
.r2{grid-row:span 2}

/* =====================================================================
   CARDS
   ===================================================================== */
.card{background:var(--card);border:1px solid var(--ln);border-radius:var(--r);box-shadow:var(--sh);padding:20px 22px;position:relative;min-width:0;display:flex;flex-direction:column;transition:box-shadow .2s,transform .2s}
.card:hover{box-shadow:var(--sh),0 10px 28px -14px rgba(16,24,40,.18)}
:root[data-theme="dark"] .card:hover{box-shadow:var(--sh)}
.card.flat:hover{box-shadow:var(--sh)}
.ch{display:flex;align-items:center;gap:8px;margin-bottom:4px;min-height:22px}
.ttl{font-size:13.5px;font-weight:600;color:var(--tx)}
.ttl small{font-weight:500;color:var(--mu);font-size:12px;margin-left:4px}
.ch .grow{flex:1}
.lbl{font-size:12px;color:var(--mu)}
.ill{position:absolute;right:20px;top:16px;width:64px;height:64px;border-radius:20px;display:grid;place-items:center;color:#fff;box-shadow:0 12px 20px -8px var(--ic,#1f5fe0),inset 0 -6px 10px rgba(0,0,0,.14),inset 0 2px 3px rgba(255,255,255,.4);background:linear-gradient(145deg,var(--ic2,#6ea0ff),var(--ic,#1f5fe0));transform:rotate(-5deg);pointer-events:none}
.ill svg{width:30px;height:30px;stroke-width:1.7;filter:drop-shadow(0 2px 2px rgba(0,0,0,.22))}
.ill.g{--ic:#16a34a;--ic2:#5fd68a}.ill.a{--ic:#e08a00;--ic2:#ffc254}.ill.v{--ic:#7c3aed;--ic2:#b08cff}.ill.t{--ic:#0d9488;--ic2:#5eead4}.ill.r{--ic:#e11d48;--ic2:#ff7a95}.ill.s{--ic:#0284c7;--ic2:#6fd0ff}.ill.k{--ic:#1f2937;--ic2:#4b5563}
.ill.sm{width:52px;height:52px;border-radius:16px}.ill.sm svg{width:24px;height:24px}
.big{font-size:56px;font-weight:700;letter-spacing:-.045em;line-height:1;font-variant-numeric:tabular-nums}
.big .cur{font-size:.5em;font-weight:600;letter-spacing:-.02em;margin-right:.08em;vertical-align:.18em;color:var(--tx2)}
.big .dec{font-size:.5em;font-weight:600;color:var(--mu);letter-spacing:-.01em}
.big.neg{color:var(--rd)}
.mid{font-size:30px;font-weight:700;letter-spacing:-.035em;line-height:1.05;font-variant-numeric:tabular-nums}
.mid .cur{font-size:.55em;font-weight:600;color:var(--tx2);margin-right:.1em;vertical-align:.1em}
.mid .dec{font-size:.55em;font-weight:600;color:var(--mu)}
.md2{font-size:22px;font-weight:700;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.pos{color:var(--gr)}.neg{color:var(--rd)}.warn{color:var(--am)}.mu{color:var(--mu)}
.xs{font-size:11.5px}.sm{font-size:12.5px}
.fw6{font-weight:600}.fw7{font-weight:700}
.stack{display:flex;flex-direction:column}.gap4{gap:4px}.gap8{gap:8px}.gap12{gap:12px}.gap16{gap:16px}
.rowf{display:flex;align-items:center;gap:10px}.wrap{flex-wrap:wrap}.between{justify-content:space-between}.grow{flex:1;min-width:0}
.mt4{margin-top:4px}.mt8{margin-top:8px}.mt12{margin-top:12px}.mt16{margin-top:16px}.mt20{margin-top:20px}.mb8{margin-bottom:8px}
.ellip{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
hr.sep{border:0;border-top:1px solid var(--ln);margin:14px 0}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:8px 14px;border-radius:10px;font-weight:600;font-size:13px;border:1px solid var(--ln2);background:var(--card);color:var(--tx);transition:background .15s,border-color .15s,transform .05s,box-shadow .15s;white-space:nowrap}
.btn:hover{background:var(--sub)}
.btn:active{transform:translateY(1px)}
.btn.pri{background:linear-gradient(180deg,var(--bl2),var(--bl));border-color:var(--bl);color:#fff;box-shadow:0 1px 2px rgba(31,95,224,.3),inset 0 1px 0 rgba(255,255,255,.18)}
.btn.pri:hover{background:linear-gradient(180deg,#4a82ff,var(--bl2))}
.btn.dng{color:var(--rd);border-color:transparent;background:var(--rdS)}
.btn.dng:hover{filter:brightness(.97)}
.btn.sm{padding:5px 11px;font-size:12px;border-radius:9px}
.btn.gh{border-color:transparent;background:transparent;color:var(--mu)}
.btn.gh:hover{background:var(--sub);color:var(--tx)}
.btn.blk{width:100%}
.lnk{color:var(--bl);font-weight:600;font-size:12.5px;display:inline-flex;align-items:center;gap:4px}
.lnk:hover{text-decoration:underline}
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:999px;font-size:11.5px;font-weight:600;background:var(--sub);color:var(--mu)}
.pill.gr{background:var(--grS);color:var(--gr)}.pill.rd{background:var(--rdS);color:var(--rd)}.pill.am{background:var(--amS);color:var(--am)}.pill.bl{background:var(--blS);color:var(--blT)}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
.sq{width:9px;height:9px;border-radius:3px;display:inline-block;flex:none}

/* progress */
.pbar{height:8px;border-radius:99px;background:var(--sub2);overflow:hidden;position:relative}
.pbar>i{display:block;height:100%;border-radius:99px;background:var(--bl);transition:width .6s cubic-bezier(.2,.8,.2,1)}
.pbar.gr>i{background:var(--gr)}.pbar.rd>i{background:var(--rd)}.pbar.am>i{background:var(--am)}.pbar.t>i{background:var(--g-fitness)}
.pbar.lg{height:12px}
.seg{display:flex;gap:2px;height:11px;border-radius:99px;overflow:hidden;background:var(--sub2)}
.seg>i{display:block;height:100%;transition:flex-basis .6s cubic-bezier(.2,.8,.2,1);min-width:0}
.seg>i:first-child{border-radius:99px 0 0 99px}.seg>i:last-child{border-radius:0 99px 99px 0}
.leg{display:flex;flex-wrap:wrap;gap:14px 26px;margin-top:16px}
.leg>div{min-width:92px}
.leg .k{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--mu);margin-bottom:3px;white-space:nowrap}
.leg .v{font-size:14px;font-weight:700;letter-spacing:-.02em;display:flex;align-items:baseline;gap:6px;white-space:nowrap}
.leg .v small{font-size:10.5px;color:var(--mu);font-weight:500}
.leg .edit{color:var(--mu);display:inline-grid;place-items:center;margin-left:2px}

/* rows & lists */
.list>.li{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--ln)}
.list>.li:first-child{border-top:0}
.li .n{flex:1;min-width:0;font-size:13px;font-weight:500}
.li .n small{display:block;color:var(--mu);font-weight:400;font-size:11.5px}
.li .v{font-weight:600;font-size:13px;font-variant-numeric:tabular-nums;white-space:nowrap}
.li.paid .n,.li.paid .v{color:var(--mu2);text-decoration:line-through;text-decoration-color:var(--mu2)}
.li.clk{cursor:pointer}
.li.clk:hover .n{color:var(--bl)}
.chk{width:20px;height:20px;border-radius:50%;border:1.6px solid var(--ln2);flex:none;display:grid;place-items:center;color:transparent;transition:all .15s;background:var(--card)}
.chk:hover{border-color:var(--bl)}
.chk.on{background:var(--gr);border-color:var(--gr);color:#fff}
.chk svg{width:12px;height:12px;stroke-width:3}
.ico{width:36px;height:36px;border-radius:11px;background:var(--blS);color:var(--bl);display:grid;place-items:center;flex:none}
.ico.gr{background:var(--grS);color:var(--gr)}.ico.am{background:var(--amS);color:var(--am)}.ico.rd{background:var(--rdS);color:var(--rd)}.ico.gy{background:var(--sub);color:var(--mu)}.ico.t{background:#d8f6f1;color:#0d9488}.ico.v{background:#ede7ff;color:#7c3aed}
:root[data-theme="dark"] .ico.t{background:#0d2d2a}:root[data-theme="dark"] .ico.v{background:#251d45}

.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.daychip{min-width:62px;flex:1;padding:9px 6px 8px;border-radius:13px;background:var(--sub);font-weight:700;font-size:15px;text-align:center;transition:all .15s;line-height:1.1}
.daychip small{display:block;font-weight:500;font-size:9px;color:var(--mu);margin-top:3px;letter-spacing:.1em;min-height:10px}
.daychip:hover{background:var(--sub2)}
.daychip.on{background:linear-gradient(180deg,var(--bl2),var(--bl));color:#fff;box-shadow:0 6px 14px -6px var(--bl)}
.daychip.on small{color:rgba(255,255,255,.85)}
.tabs{display:flex;background:var(--sub);border-radius:12px;padding:3px;gap:2px}
.tabs button{flex:1;padding:7px 12px;border-radius:9px;font-weight:600;font-size:12.5px;color:var(--mu);transition:all .15s;white-space:nowrap}
.tabs button.on{background:var(--card);color:var(--tx);box-shadow:0 1px 3px rgba(0,0,0,.1)}
.fchips{display:flex;gap:6px;flex-wrap:wrap}
.fchip{padding:6px 13px;border-radius:999px;font-size:12.5px;font-weight:600;background:var(--card);border:1px solid var(--ln2);color:var(--tx2);transition:all .15s}
.fchip:hover{background:var(--sub)}
.fchip.on{background:var(--tx);color:var(--card);border-color:var(--tx)}
.search{display:flex;align-items:center;gap:8px;background:var(--sub);border-radius:11px;padding:0 12px;height:36px;min-width:180px}
.search input{border:0;background:none;outline:none;flex:1;font-size:13px;min-width:0}
.search svg{color:var(--mu)}

/* empty & skeleton */
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;padding:22px 14px;color:var(--mu);font-size:13px;flex:1;justify-content:center}
.empty .eic{width:46px;height:46px;border-radius:14px;background:var(--sub);display:grid;place-items:center;color:var(--mu2);margin-bottom:4px}
.empty b{color:var(--tx2);font-weight:600;font-size:13.5px}
.empty .btn{margin-top:8px}
.skel{background:linear-gradient(90deg,var(--sub) 25%,var(--sub2) 50%,var(--sub) 75%);background-size:200% 100%;animation:sk 1.2s linear infinite;border-radius:12px}
@keyframes sk{from{background-position:200% 0}to{background-position:-200% 0}}

/* =====================================================================
   DASHBOARD SPECIFICS
   ===================================================================== */
.saldo-top{display:flex;align-items:center;gap:22px;margin-top:22px;flex-wrap:wrap}
.saldo-note{display:flex;gap:14px;align-items:center;padding-left:20px;border-left:1px solid var(--ln2);min-height:34px}
.saldo-note b{font-size:12.5px;display:flex;align-items:center;gap:4px;font-weight:600}
.saldo-note span{font-size:12px;color:var(--mu);display:block;max-width:300px;line-height:1.35}
.saldo-card .seg{margin-top:24px}
.pay-scroll{overflow-y:auto;max-height:340px;margin:4px -6px 0;padding:0 6px;flex:1}
.pay-h{margin-top:14px}
.sbar{position:relative;height:34px;border-radius:9px;overflow:hidden;display:flex}
.sbar>div{display:flex;align-items:center;padding:0 10px;color:#fff;font-size:11px;font-weight:700;white-space:nowrap}
.cat-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--ln);font-size:13px}
.cat-row:first-child{border-top:0}
.cat-row .v{margin-left:auto;font-weight:600;font-variant-numeric:tabular-nums}
.cat-row .p{width:40px;text-align:right;color:var(--mu);font-size:11.5px}
.cards-row{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -22px;padding:4px 22px 6px;scrollbar-width:none}
.cards-row::-webkit-scrollbar{display:none}
.cc{flex:none;width:calc(100% - 44px);max-width:340px;aspect-ratio:1.62;border-radius:18px;padding:16px 18px;color:#fff;position:relative;scroll-snap-align:start;display:flex;flex-direction:column;justify-content:space-between;background:linear-gradient(135deg,var(--c1),var(--c2));box-shadow:0 14px 26px -14px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.12);overflow:hidden;cursor:pointer;transition:transform .2s}
.cc:hover{transform:translateY(-2px)}
.cc::before{content:"";position:absolute;inset:0;background:radial-gradient(120% 90% at 100% 0,rgba(255,255,255,.14),transparent 55%);pointer-events:none}
.cc .t{display:flex;justify-content:space-between;align-items:center;font-weight:700;font-size:15px;letter-spacing:-.01em}

<script>
/* =====================================================================
   VIDA GABRIELA — app pessoal (solo)
   Dois contextos totalmente separados:

'use strict';

/* ---------- utilitários ---------- */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const pad = n => String(n).padStart(2, '0');

const clamp = (n, a, b) => Math.min(b, Math.max(a, n));

function bigMoney(v, cls = '') {
  const neg = v < 0, s = Math.abs(+v || 0).toFixed(2).split('.');

}
const MONTHS = ['Janeiro', 'Fevereiro', 'Março', 'Abril', 'Maio', 'Junho', 'Julho', 'Agosto', 'Setembro', 'Outubro', 'Novembro', 'Dezembro'];
const MON3 = MONTHS.map(m => m.slice(0, 3));

const isoD = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());

const daysIn = ym => { const [y, m] = ym.split('-').map(Number); return new Date(y, m, 0).getDate(); };

/* ---------- ícones (estilo Lucide, SVG inline) ---------- */
const ICONS = {

function normalize(d) {
  const e = emptyData(); d = (d && typeof d === 'object') ? d : {};
  for (const k of Object.keys(e)) if (d[k] === undefined || d[k] === null) d[k] = e[k];

  d.settings = Object.assign({ weekGoal: 0, name: 'Gabriela' }, d.settings);
  d.reserve = Object.assign({ initial: 0 }, d.reserve);
  if (!d.cats.length) d.cats = e.cats;
  return d;
}
function loadReal() {
  try { const raw = localStorage.getItem(KEY); if (raw) return normalize(JSON.parse(raw)); } catch (e) { }
  return emptyData();
}
const isEmptyData = d => !(d.tx.length || d.cards.length || d.buys.length || d.apt.info || d.apt.parc.length || d.apt.obra.length || d.workouts.length || d.plan.length || d.body.length || d.events.length || d.goals.length || d.docs.length || d.reserve.initial || d.settings.weekGoal);

const Files = {
  mem: new Map(),
  _db: null,
  db() { return this._db || (this._db = new Promise((res, rej) => { const q = indexedDB.open('vidagabriela-files', 1); q.onupgradeneeded = () => q.result.createObjectStore('f'); q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); })); },
  async put(id, blob) {
    if (isDemo()) { this.mem.set(id, blob); return; }
    const db = await this.db(); return new Promise((res, rej) => { const t = db.transaction('f', 'readwrite'); t.objectStore('f').put(blob, id); t.oncomplete = res; t.onerror = () => rej(t.error); });
  },
  async get(id) {
    if (isDemo()) return this.mem.get(id) || null;
    const db = await this.db(); return new Promise((res, rej) => { const q = db.transaction('f').objectStore('f').get(id); q.onsuccess = () => res(q.result || null); q.onerror = () => rej(q.error); });
  },
  async del(id) {
    if (isDemo()) { this.mem.delete(id); return; }
    try { const db = await this.db(); db.transaction('f', 'readwrite').objectStore('f').delete(id); } catch (e) { }

};

/* =====================================================================
   DOMÍNIO — cálculos (puros, sempre sobre D() do contexto ativo)
   ===================================================================== */
const catOf = (id, d = D()) => d.cats.find(c => c.id === id) || { id: 'outros', name: 'Sem categoria', color: '#94a3b8', group: 'dia' };

/** ocorrência de um lançamento num mês */
function occ(t, ym) {
  const sym = t.date.slice(0, 7);
  if (!t.rec) return sym === ym ? { day: +t.date.slice(8) } : null;
  if (ym < sym || (t.end && ym > t.end)) return null;
  return { day: Math.min(+t.date.slice(8), daysIn(ym)) };
}
/** mês de fatura de uma compra */
const invMonth = (b, c) => { const ym = b.date.slice(0, 7); return (c.close && +b.date.slice(8) > c.close) ? ymAdd(ym, 1) : ym; };
function cardBuys(c, ym, d = D()) {
  const out = [];
  d.buys.forEach(b => {
    if (b.card !== c.id) return;
    const n = b.n || 1, k = ymDiff(invMonth(b, c), ym);
    if (k >= 0 && k < n) out.push({ b, k, n, amt: r2(b.val / n) });
  });
  return out;
}
const invoice = (c, ym, d = D()) => r2(sum(cardBuys(c, ym, d).map(x => x.amt)));
const cardUsed = (c, d = D()) => { // total comprometido (faturas abertas a partir de hoje)
  let s = 0; const m0 = curYM();
  for (let i = -1; i < 24; i++) { const ym = ymAdd(m0, i); if (!(c.paid && c.paid[ym])) s += invoice(c, ym, d); }
  return r2(s);
};
const aptStatus = (p, T = todayISO()) => p.paid ? 'Paga' : p.due < T ? 'Atrasada' : daysBetween(T, p.due) > 120 ? 'Futura' : 'Pendente';

/** itens unificados de um mês (receitas, contas, faturas, parcelas do apto) */
function monthItems(ym, d = D()) {
  const T = todayISO(), out = [];
  d.tx.forEach(t => {
    const o = occ(t, ym); if (!o) return;
    const c = catOf(t.cat, d);
    out.push({ key: 't:' + t.id, kind: 'tx', id: t.id, type: t.type, desc: t.desc, val: +t.val, day: o.day, cat: t.cat, group: t.type === 'in' ? 'renda' : c.group, paid: !!(t.paid && t.paid[ym]), rec: t.rec });
  });
  d.cards.forEach(c => {
    const v = invoice(c, ym, d); if (v <= 0) return;
    out.push({ key: 'c:' + c.id, kind: 'card', id: c.id, type: 'out', desc: 'Fatura ' + c.name, val: v, day: Math.min(c.due || 1, daysIn(ym)), cat: 'cartao', group: 'cartao', paid: !!(c.paid && c.paid[ym]) });
  });
  d.apt.parc.forEach(p => {
    if (p.due.slice(0, 7) !== ym) return;
    out.push({ key: 'a:' + p.id, kind: 'apt', id: p.id, type: 'out', desc: 'Apto · ' + p.desc, val: +p.val, day: +p.due.slice(8), cat: 'apartamento', group: 'apto', paid: !!p.paid });
  });
  out.forEach(i => { i.date = ym + '-' + pad(i.day); i.over = i.type === 'out' && !i.paid && i.date < T; });
  return out.sort((a, b) => a.day - b.day || a.desc.localeCompare(b.desc));
}
function budget(ym, d = D()) {
  const items = monthItems(ym, d), g = { fixas: 0, cartao: 0, apto: 0, fitness: 0, dia: 0, reserva: 0 };
  let inc = 0, paidOut = 0;
  items.forEach(i => {
    if (i.type === 'in') inc += i.val;
    else { g[g[i.group] === undefined ? 'dia' : i.group] += i.val; if (i.paid) paidOut += i.val; }
  });
  const spent = sum(Object.values(g));
  return { items, inc: r2(inc), g, spent: r2(spent), sobra: r2(inc - spent), paidOut: r2(paidOut), outs: items.filter(i => i.type === 'out') };
}
const reserveBal = (d = D()) => {
  let s = +d.reserve.initial || 0;
  d.tx.forEach(t => { if (t.type === 'out' && catOf(t.cat, d).group === 'reserva') Object.values(t.paid || {}).forEach(v => { if (v) s += +t.val; }); });
  return r2(s);
};
function setPaid(it, val) {
  const d = D();
  if (it.kind === 'tx') { const t = d.tx.find(x => x.id === it.id); if (!t) return; t.paid = t.paid || {}; if (val) t.paid[S.ym] = true; else delete t.paid[S.ym]; }
  if (it.kind === 'card') { const c = d.cards.find(x => x.id === it.id); if (!c) return; c.paid = c.paid || {}; if (val) c.paid[S.ym] = true; else delete c.paid[S.ym]; }
  if (it.kind === 'apt') { const p = d.apt.parc.find(x => x.id === it.id); if (!p) return; p.paid = !!val; p.paidDate = val ? todayISO() : ''; }
}

/* ---- apartamento ---- */
function aptStats(d = D()) {
  const a = d.apt, info = a.info, T = todayISO();
  const obra = [...a.obra].sort((x, y) => x.date.localeCompare(y.date));
  const last = obra[obra.length - 1];
  const parcPaid = sum(a.parc.filter(p => p.paid).map(p => p.val));
  const value = +(info && info.value) || 0;
  const paid = r2((+(info && info.entrada) || 0) + parcPaid);
  const rest = Math.max(0, r2(value - paid));
  const late = a.parc.filter(p => !p.paid && p.due < T).sort((x, y) => x.due.localeCompare(y.due));
  const next = a.parc.filter(p => !p.paid && p.due >= T).sort((x, y) => x.due.localeCompare(y.due))[0];
  return { info, obra, last, pctObra: last ? last.pct : 0, phases: last ? last.phases || {} : {}, value, paid, rest, paidPct: pct(paid, value), late, next, parcPaid };
}

/* ---- fitness ---- */
function fitStats(d = D()) {
  const T = todayISO(), ws = weekStart(T), we = dateAdd(ws, 6), dates = new Set(d.workouts.map(w => w.date));
  const week = d.workouts.filter(w => w.date >= ws && w.date <= we);
  const weekDays = Array.from({ length: 7 }, (_, i) => { const dt = dateAdd(ws, i); return { dt, on: dates.has(dt), td: dt === T, wd: parseD(dt).getDay() }; });
  let streak = 0, c = dates.has(T) ? T : dateAdd(T, -1);
  while (dates.has(c)) { streak++; c = dateAdd(c, -1); }
  const ym = T.slice(0, 7), month = d.workouts.filter(w => w.date.slice(0, 7) === ym);
  const cardio = month.filter(w => w.type === 'cardio');
  const body = [...d.body].sort((a, b) => a.date.localeCompare(b.date));
  const wts = body.filter(b => b.kg);
  // progressão por exercício
  const map = {};
  [...d.workouts].sort((a, b) => a.date.localeCompare(b.date)).forEach(w => (w.ex || []).forEach(e => {
    if (!e.name || !(+e.kg > 0)) return;
    const k = e.name.trim().toLowerCase(), o = map[k] || (map[k] = { name: e.name.trim(), cur: 0, prev: 0, rec: 0, recDate: '' });
    o.prev = o.cur; o.cur = +e.kg;
    if (+e.kg >= o.rec) { o.rec = +e.kg; o.recDate = w.date; }
  }));
  const prs = Object.values(map).sort((a, b) => b.cur - a.cur);

let _gid = 0;
function lineChart(pts, o = {}) {
  if (!pts.length) return '';
  const W = 640, H = o.h || 190, L = 44, Rr = 16, T = 16, B = 28, gid = 'lg' + (++_gid);
  const vals = pts.map(p => p.v).concat(o.target != null ? [o.target] : []);
  let mn = Math.min(...vals), mx = Math.max(...vals); if (mn === mx) { mn -= 1; mx += 1; }

  const x = i => pts.length === 1 ? (L + (W - L - Rr) / 2) : L + i * (W - L - Rr) / (pts.length - 1);
  const y = v => T + (1 - (v - mn) / (mx - mn)) * (H - T - B);
  const fmt = o.fmt || (v => N(v, 1)), col = o.color || 'var(--bl)';
  let g = '';
  for (let i = 0; i < 4; i++) { const v = mn + (mx - mn) * i / 3, yy = y(v); g += `<line x1="${L}" x2="${W - Rr}" y1="${yy}" y2="${yy}" stroke="var(--ln)" stroke-width="1"/><text x="${L - 8}" y="${yy + 4}" text-anchor="end" font-size="11" fill="var(--mu)">${fmt(v)}</text>`; }
  const path = pts.map((p, i) => (i ? 'L' : 'M') + x(i).toFixed(1) + ' ' + y(p.v).toFixed(1)).join(' ');
  const area = path + ` L${x(pts.length - 1).toFixed(1)} ${H - B} L${x(0).toFixed(1)} ${H - B} Z`;
  const step = Math.ceil(pts.length / 8);
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="${esc(o.label || 'Gráfico de linha')}" style="display:block;overflow:visible"><defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${col}" stop-opacity=".22"/><stop offset="1" stop-color="${col}" stop-opacity="0"/></linearGradient></defs>${g}
  ${o.target != null ? `<line x1="${L}" x2="${W - Rr}" y1="${y(o.target)}" y2="${y(o.target)}" stroke="var(--g-sobra)" stroke-dasharray="5 5" stroke-width="1.5"/><text x="${W - Rr}" y="${y(o.target) - 6}" text-anchor="end" font-size="11" font-weight="600" fill="var(--gr)">${esc(o.targetLabel || 'Meta')} ${fmt(o.target)}</text>` : ''}
  ${pts.length > 1 ? `<path d="${area}" fill="url(#${gid})"/>` : ''}<path d="${path}" fill="none" stroke="${col}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
  ${pts.map((p, i) => `<circle cx="${x(i).toFixed(1)}" cy="${y(p.v).toFixed(1)}" r="4.5" fill="var(--card)" stroke="${col}" stroke-width="2.2"><title>${esc(p.l)}: ${fmt(p.v)}</title></circle>${i % step === 0 || i === pts.length - 1 ? `<text x="${x(i)}" y="${H - 8}" text-anchor="middle" font-size="11" fill="var(--mu)">${esc(p.l)}</text>` : ''}`).join('')}</svg>`;
}
function barChart(pts, o = {}) {
  if (!pts.length) return '';
  const W = 640, H = o.h || 170, L = 8, Rr = 8, T = 22, B = 26, mx = Math.max(o.max || 0, ...pts.map(p => p.v), 1);
  const bw = (W - L - Rr) / pts.length, fmt = o.fmt || (v => N(v, 0)), col = o.color || 'var(--bl)';
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="${esc(o.label || 'Gráfico de barras')}" style="display:block">
  <line x1="${L}" x2="${W - Rr}" y1="${H - B}" y2="${H - B}" stroke="var(--ln2)"/>
  ${o.target ? `<line x1="${L}" x2="${W - Rr}" y1="${T + (1 - o.target / mx) * (H - T - B)}" y2="${T + (1 - o.target / mx) * (H - T - B)}" stroke="var(--g-sobra)" stroke-dasharray="5 5"/>` : ''}
  ${pts.map((p, i) => { const h = p.v / mx * (H - T - B), x = L + i * bw + bw * .2, w = bw * .6; return `<rect x="${x.toFixed(1)}" y="${(H - B - h).toFixed(1)}" width="${w.toFixed(1)}" height="${Math.max(h, 0).toFixed(1)}" rx="6" fill="${p.c || col}" opacity="${p.cur ? 1 : .85}"><title>${esc(p.l)}: ${fmt(p.v)}</title></rect>${p.v ? `<text x="${(x + w / 2).toFixed(1)}" y="${(H - B - h - 6).toFixed(1)}" text-anchor="middle" font-size="11" font-weight="600" fill="var(--tx2)">${fmt(p.v)}</text>` : ''}<text x="${(x + w / 2).toFixed(1)}" y="${H - 8}" text-anchor="middle" font-size="11" fill="var(--mu)">${esc(p.l)}</text>`; }).join('')}</svg>`;
}
function dualChart(pts, o = {}) { // receitas x saídas
  const W = 640, H = o.h || 200, L = 8, Rr = 8, T = 16, B = 26, mx = Math.max(...pts.map(p => Math.max(p.a, p.b)), 1), bw = (W - L - Rr) / pts.length;
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Receitas e saídas por mês" style="display:block">
  <line x1="${L}" x2="${W - Rr}" y1="${H - B}" y2="${H - B}" stroke="var(--ln2)"/>
  ${pts.map((p, i) => { const x0 = L + i * bw + bw * .14, w = bw * .34, ha = p.a / mx * (H - T - B), hb = p.b / mx * (H - T - B);
    return `<rect x="${x0.toFixed(1)}" y="${(H - B - ha).toFixed(1)}" width="${w.toFixed(1)}" height="${ha.toFixed(1)}" rx="5" fill="var(--g-sobra)"><title>${esc(p.l)} · receitas: ${R(p.a)}</title></rect><rect x="${(x0 + w + 4).toFixed(1)}" y="${(H - B - hb).toFixed(1)}" width="${w.toFixed(1)}" height="${hb.toFixed(1)}" rx="5" fill="var(--bl)"><title>${esc(p.l)} · saídas: ${R(p.b)}</title></rect><text x="${(L + i * bw + bw / 2).toFixed(1)}" y="${H - 8}" text-anchor="middle" font-size="11" fill="${p.cur ? 'var(--tx)' : 'var(--mu)'}" font-weight="${p.cur ? 700 : 400}">${esc(p.l)}</text>`; }).join('')}</svg>`;
}
/** prédio que evolui conforme a obra */
function buildingSVG(p) {
  const FL = 12, fh = 11, x0 = 34, w = 92, base = 184, built = p / 100 * FL;
  let s = '';
  for (let i = 0; i < FL; i++) {
    const y = base - (i + 1) * fh, fill = clamp(built - i, 0, 1);
    if (fill >= 1) {
      s += `<rect x="${x0}" y="${y}" width="${w}" height="${fh}" fill="var(--bl)" opacity="${.95 - i * .02}" stroke="var(--card)" stroke-width="1"/>`;
      for (let k = 0; k < 5; k++) s += `<rect x="${x0 + 7 + k * 17.5}" y="${y + 3}" width="9" height="5" rx="1" fill="#fff" opacity=".78"/>`;
    } else if (fill > 0) {
      s += `<rect x="${x0}" y="${y + fh * (1 - fill)}" width="${w}" height="${fh * fill}" fill="var(--bl)" opacity=".55"/><rect x="${x0}" y="${y}" width="${w}" height="${fh}" fill="none" stroke="var(--bl)" stroke-dasharray="3 3" opacity=".7"/>`;
    } else s += `<rect x="${x0}" y="${y}" width="${w}" height="${fh}" fill="none" stroke="var(--ln2)" stroke-dasharray="3 3"/>`;
  }
  const topY = base - clamp(Math.ceil(built), 0, FL) * fh;
  const crane = p < 100 ? `<g stroke="var(--am)" stroke-width="2" fill="none" stroke-linecap="round"><path d="M138 ${base} V18 M138 18 H64 M138 18 H156 M72 18 V30 M72 30 v4"/><path d="M138 30 L112 18 M138 46 L112 18" stroke-width="1.2"/></g><rect x="69" y="34" width="7" height="5" fill="var(--am)"/>` : '';
  return `<svg class="bld" viewBox="0 0 170 196" role="img" aria-label="Prédio com ${Math.round(p)}% da obra concluída"><rect x="0" y="${base}" width="170" height="3" rx="1.5" fill="var(--ln2)"/>${s}${p >= 100 ? `<path d="M${x0} ${topY} h${w} v-5 h-${w}z" fill="var(--gr)"/>` : ''}${crane}</svg>`;
}

function cSaldo(b, cls = 's8 c-saldo') {
  const total = Math.max(b.inc, b.spent);
  const keys = ['fixas', 'cartao', 'apto', 'fitness', 'dia', 'reserva'];
  const parts = keys.map(k => ({ k, v: b.g[k], c: GROUPS[k].color, n: GROUPS[k].name })).concat([{ k: 'sobra', v: Math.max(b.sobra, 0), c: 'var(--g-sobra)', n: 'Sobra' }]);
  const bar = total > 0 ? parts.filter(p => p.v > 0).map(p => `<i style="flex:${p.v} 1 0;background:${p.c}" title="${p.n}: ${R(p.v)}"></i>`).join('') : '';
  const has = b.items.length > 0;
  const pctLivre = b.inc > 0 ? Math.round(b.sobra / b.inc * 100) : 0;
  const note = !has ? `<div class="saldo-note"><span>Nenhum lançamento neste mês.<br>Cadastre sua renda e suas contas para ver a previsão.</span></div>`
    : b.sobra < 0 ? `<div class="saldo-note"><div><b class="neg">${ic('alert', 's')} Gastos acima da renda</b><span>Os compromissos do mês superam a renda em ${R(-b.sobra)}.</span></div></div>`
      : `<div class="saldo-note"><div><b class="pos">${ic('trend', 's')} ${pctLivre}% da renda livre</b><span>Valor estimado após pagar todos os compromissos do mês.</span></div></div>`;
  const leg = `<div><div class="k">Renda <button class="edit" data-act="nav" data-p="renda" aria-label="Editar renda">${ic('pencil', 's')}</button></div><div class="v">${R(b.inc)}</div></div>` +
    parts.map(p => `<div><div class="k"><span class="dot" style="background:${p.c}"></span>${p.k === 'sobra' ? '= Sobra' : p.n}</div><div class="v" style="${p.k === 'sobra' ? 'color:var(--gr)' : ''}">${p.k === 'sobra' ? '' : '− '}${R(p.k === 'sobra' ? b.sobra : p.v)}<small>${total > 0 ? Math.round(p.v / total * 100) + '%' : '0%'}</small></div></div>`).join('');

function cPagar(b) {

  if (S.payDay != null && !days.includes(S.payDay)) S.payDay = null;
  const list = (S.payDay == null ? outs : outs.filter(i => i.day === S.payDay)).slice().sort((a, c) => (a.paid - c.paid) || (a.day - c.day));
  const next = pend.slice().sort((a, c) => a.date.localeCompare(c.date))[0];
  const nt = next ? (() => { const df = daysBetween(todayISO(), next.date); return df < 0 ? `atrasada há ${-df} dia${df === -1 ? '' : 's'}` : df === 0 ? 'próxima vence hoje' : `próxima em ${df} dia${df === 1 ? '' : 's'}`; })() : '';

  const tot = ym => sum(d.cards.map(c => invoice(c, ym)));
  const t3 = [0, 1, 2].map(i => tot(ymAdd(S.ym, i)));
  const mx = Math.max(...t3, 1), mn = Math.min(...t3);
  let body;
  if (!d.cards.length) body = emptyBox('card', 'Nenhum cartão cadastrado', 'Cadastre seus cartões para acompanhar faturas e limites.', 'Novo cartão', 'add', 'data-v="card"');
  else {
    const ptY = v => mx === mn ? 50 : 26 + (1 - (v - mn) / (mx - mn)) * 40;
    body = `<div class="cards-row mt12" id="ccRow">${d.cards.map(c => ccHTML(c, ymSel)).join('')}</div>
    <div class="mk">Próximas faturas</div>
    <div class="inv-3" style="position:relative">${t3.map((v, i) => { const ym = ymAdd(S.ym, i); return `<button class="${i === off ? 'on' : ''}" data-act="invOff" data-v="${i}"><span class="m">${MON3[+ym.slice(5) - 1]}${ym.slice(0, 4) !== S.ym.slice(0, 4) ? ' ' + ym.slice(2, 4) : ''}</span><span class="a">${R(v)}</span></button>`; }).join('')}
    <svg viewBox="0 0 300 100" preserveAspectRatio="none" style="position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none"><polyline fill="none" stroke="var(--mu2)" stroke-width="1.4" stroke-dasharray="4 4" vector-effect="non-scaling-stroke" points="${t3.map((v, i) => `${(i + .5) * 100},${ptY(v)}`).join(' ')}"/></svg>
    ${t3.map((v, i) => `<span style="position:absolute;left:calc(${(i + .5) / 3 * 100}% - 5px);top:calc(${ptY(v)}% - 5px);width:10px;height:10px;border-radius:50%;background:var(--card);border:2px solid ${i === off ? 'var(--bl)' : 'var(--mu2)'};pointer-events:none"></span>`).join('')}</div>`;
  }
  return `<section class="card s4 c-half c-cart">${illus('card', 's')}<div class="ch"><span class="ttl">Cartões</span></div>
  <div class="lbl mt12">Fatura de ${MONTHS[+ymSel.slice(5) - 1].toLowerCase()}</div><div class="mt4">${bigMoney(tot(ymSel), 'mid tnum')}</div>
  <div class="rowf between mt12"><button class="btn sm" data-act="viewInvoice">Ver fatura</button>${d.cards.length > 1 ? `<div class="rowf" style="gap:6px"><button class="ib bord" data-act="scrollCards" data-v="-1" aria-label="Cartão anterior">${ic('left', 's')}</button><button class="ib bord" data-act="scrollCards" data-v="1" aria-label="Próximo cartão">${ic('right', 's')}</button></div>` : ''}</div>
  ${body}</section>`;
}

function dueIn(iso) { if (!iso) return ''; const df = daysBetween(todayISO(), iso); if (df < 0) return 'prazo vencido'; if (df < 60) return `em ${df} dia${df === 1 ? '' : 's'}`; const m = Math.round(df / 30.4); return m < 24 ? `em ${m} meses` : `em ${(m / 12).toFixed(1).replace('.', ',')} anos`; }

function cObra() {
  const a = aptStats();
  if (!a.info) return `<section class="card s8">${illus('hat', 'a')}<div class="ch"><span class="ttl">Obra</span></div>${emptyBox('building', 'Nenhum apartamento cadastrado', 'Cadastre seu apartamento para acompanhar a obra.', 'Cadastrar apartamento', 'aptInfo')}</section>`;
  const ph = PHASES.map(p => `<div class="ph"><div class="rowf"><span class="ellip">${p}</span><b>${a.phases[p] || 0}%</b></div>${pbar(a.phases[p] || 0, (a.phases[p] || 0) >= 100 ? 'gr' : '')}</div>`).join('');
  return `<section class="card s8">${illus('hat', 'a')}<div class="ch"><span class="ttl">Obra <small>${esc(a.info.name || 'Apartamento')}</small></span></div>
  <div class="rowf mt12" style="align-items:flex-start;gap:26px;flex-wrap:wrap">
   <div style="width:120px;flex:none;margin-top:-4px">${buildingSVG(a.pctObra)}</div>
   <div class="grow" style="min-width:240px">
     <div class="rowf wrap" style="gap:14px"><div class="big" style="font-size:50px">${Math.round(a.pctObra)}<span class="dec" style="font-size:.5em">%</span></div><div><span class="pill ${a.last ? 'bl' : ''}">${a.last ? 'Em andamento' : 'Sem atualização'}</span><div class="lbl mt4">${a.last ? 'Atualizado em ' + fdate(a.last.date) : 'Registre a primeira atualização da obra'}</div></div></div>
     <div class="mt12">${pbar(a.pctObra, 'lg')}</div>
     <div class="kpis mt16"><div class="kpi"><div class="l">Entrega</div><div class="n" style="font-size:16px">${a.info.delivery ? fdate(a.info.delivery) : '—'}</div><div class="s">${a.info.delivery ? dueIn(a.info.delivery) : ''}</div></div><div class="kpi"><div class="l">Pago</div><div class="n" style="font-size:16px">${R(a.paid)}</div><div class="s">${Math.round(a.paidPct)}% do imóvel</div></div><div class="kpi"><div class="l">A pagar</div><div class="n" style="font-size:16px">${R(a.rest)}</div><div class="s">${a.info.unit ? esc(a.info.unit) : ''}</div></div></div>
   </div></div>
  <div class="phases mt20">${ph}</div>
  <div class="rowf mt16"><button class="btn sm pri" data-act="add" data-v="obra">${ic('hat', 's')} Atualizar obra</button><button class="btn sm" data-act="nav" data-p="apt">Ver apartamento ${ic('right', 's')}</button></div></section>`;
}
function cAptoMini() {
  const a = aptStats();
  if (!a.info) return `<section class="card s4 c-half">${illus('home', 'k')}<div class="ch"><span class="ttl">Apartamento</span></div>${emptyBox('home', 'Cadastre seu apartamento', 'Acompanhe valor, parcelas e andamento.', 'Cadastrar', 'aptInfo')}</section>`;
  const T = todayISO(), rows = a.info && D().apt.parc.filter(p => !p.paid).sort((x, y) => x.due.localeCompare(y.due)).slice(0, 4);
  return `<section class="card s4 c-half">${illus('home', 'k')}<div class="ch"><span class="ttl">Apartamento</span></div>
  <div class="lbl mt12">Valor do imóvel</div><div class="mt4">${bigMoney(a.value, 'mid tnum')}</div>
  <div class="rowf between sm mt16"><span class="pos fw6">${ic('check', 's')} Pago ${Math.round(a.paidPct)}%</span><span class="mu">referência: ${R(a.paid)}</span></div>
  <div class="mt8">${pbar(a.paidPct, 'gr lg')}</div>

  <div class="mk">Próximas parcelas</div>
  <div class="list mt8">${rows.length ? rows.map(p => `<div class="li clk" data-act="editParc" data-id="${p.id}"><div class="n">${esc(p.desc)}<small>${fdate(p.due)}</small></div><span class="pill ${aptStatus(p, T) === 'Atrasada' ? 'rd' : ''}">${aptStatus(p, T)}</span><div class="v">${R(p.val)}</div></div>`).join('') : '<div class="empty" style="padding:12px">Nenhuma parcela em aberto.</div>'}</div></section>`;
}

function cFitness() {
  const d = D(), f = fitStats(d);
  if (!d.workouts.length && !f.wts.length) return `<section class="card s8">${illus('dumbbell', 't')}<div class="ch"><span class="ttl">Fitness</span></div>${emptyBox('dumbbell', 'Nenhum treino registrado', 'Registre seu primeiro treino.', 'Novo treino', 'add', 'data-v="workout"')}</section>`;
  const today = d.plan.find(p => p.wd === parseD(f.T).getDay());
  const dw = f.weekDays.map(x => { const pl = d.plan.some(p => p.wd === x.wd); return `<div><div class="d ${x.on ? 'on' : ''} ${x.td ? 'td' : ''} ${!x.on && pl ? 'pl' : ''}">${ic('check')}</div><small>${WD3[x.wd]}</small></div>`; }).join('');
  const w = f.weight, delta = w && f.first ? w.kg - f.first.kg : 0;
  const goalW = d.goals.find(g => g.link === 'peso' && g.status !== 'concluida');
  const chart = f.wts.length > 1 ? lineChart(f.wts.map(b => ({ l: MON3[+b.date.slice(5, 7) - 1], v: b.kg })), { h: 120, color: 'var(--g-fitness)', fmt: v => N(v, 1), target: goalW ? +goalW.target : null, targetLabel: 'Meta' }) : '';
  return `<section class="card s8">${illus('dumbbell', 't')}<div class="ch"><span class="ttl">Fitness</span></div>
  <div class="rowf mt12" style="gap:28px;align-items:flex-start;flex-wrap:wrap">
   <div style="flex:1;min-width:260px"><div class="rowf between"><div><div class="md2">${f.week.length}${f.goal ? `<small class="mu" style="font-size:14px;font-weight:600"> / ${f.goal}</small>` : ''}</div><div class="lbl">treinos nesta semana</div></div>${f.goal ? '' : `<button class="btn sm" data-act="weekGoal">Definir meta</button>`}</div>
   <div class="dwk">${dw}</div>${f.goal ? `<div class="mt12">${pbar(pct(f.week.length, f.goal), 't')}</div>` : ''}</div>
   ${chart ? `<div style="flex:1.1;min-width:260px;margin-top:34px"><div class="lbl">Evolução do peso</div>${chart}</div>` : ''}</div>
  <div class="kpis mt16"><div class="kpi"><div class="l">${ic('flame', 's')} Sequência</div><div class="n">${f.streak}<small> dia${f.streak === 1 ? '' : 's'}</small></div></div><div class="kpi"><div class="l">${ic('activity', 's')} Treinos no mês</div><div class="n">${f.month.length}</div></div><div class="kpi"><div class="l">${ic('scale', 's')} Peso atual</div><div class="n">${w ? N(w.kg, 1) : '—'}<small> kg</small></div>${w && f.wts.length > 1 ? `<div class="s ${delta <= 0 ? 'pos' : 'neg'}">${delta > 0 ? '+' : ''}${N(delta, 1)} kg desde o início</div>` : ''}</div>${today ? `<div class="kpi"><div class="l">${ic('calendar', 's')} Hoje na rotina</div><div class="n" style="font-size:15px;line-height:1.25">${esc(today.name)}</div></div>` : ''}</div>
  <div class="rowf mt16"><button class="btn sm pri" data-act="add" data-v="workout">${ic('plus', 's')} Novo treino</button><button class="btn sm" data-act="nav" data-p="fit">Ver fitness ${ic('right', 's')}</button></div></section>`;
}

function goalRow(g, d = D()) {
  const p = goalPct(g, d), c = goalCur(g, d);
  return `<div class="clk" data-act="editGoal" data-id="${g.id}" style="cursor:pointer;padding:10px 0;border-top:1px solid var(--ln)"><div class="rowf between"><b class="sm">${esc(g.name)}</b><span class="pill ${p >= 100 ? 'gr' : 'bl'}">${Math.round(p)}%</span></div><div class="mt8">${pbar(p, p >= 100 ? 'gr' : '')}</div><div class="lbl mt4">${fUnit(c, g.unit)} de ${fUnit(g.target, g.unit)}</div></div>`;
}
function cMetas() {
  const d = D(), gs = d.goals.filter(g => g.status !== 'concluida').slice(0, 3);
  return `<section class="card s4 c-half">${illus('target', 'v')}<div class="ch"><span class="ttl">Metas</span></div>
  ${d.goals.length ? `<div class="lbl mt12">${d.goals.filter(g => g.status === 'concluida').length} de ${d.goals.length} concluídas</div><div class="mt8">${gs.map(g => goalRow(g, d)).join('')}</div><div class="grow"></div><div class="rowf mt12"><button class="btn sm" data-act="nav" data-p="metas">Ver metas ${ic('right', 's')}</button></div>` : emptyBox('target', 'Nenhuma meta', 'Crie sua primeira meta.', 'Nova meta', 'add', 'data-v="goal"')}</section>`;
}
function evRow(e) {
  const c = EV_CATS[e.cat] || '#94a3b8';
  return `<div class="ev clk" data-act="editEvent" data-id="${e.id}" style="cursor:pointer"><div class="dt"><b>${+e.date.slice(8)}</b><small>${MON3[+e.date.slice(5, 7) - 1]}</small></div><div class="grow tt">${esc(e.title)}<small>${e.time ? e.time + ' · ' : ''}${esc(e.cat)}</small></div><span class="dot" style="background:${c}"></span></div>`;
}
function cAgenda() {
  const d = D(), T = todayISO(), up = d.events.filter(e => e.date >= T).sort((a, b) => (a.date + (a.time || '')).localeCompare(b.date + (b.time || ''))).slice(0, 4);
  return `<section class="card s6">${illus('calendar', 'r')}<div class="ch"><span class="ttl">Agenda</span></div>
  ${up.length ? `<div class="mt12">${up.map(evRow).join('')}</div><div class="rowf mt12"><button class="btn sm" data-act="nav" data-p="agenda">Abrir agenda ${ic('right', 's')}</button></div>` : emptyBox('calendar', 'Nenhum compromisso próximo', 'Adicione eventos, consultas e lembretes.', 'Novo evento', 'add', 'data-v="event"')}</section>`;
}
function docIcon(d) { return /^image\//.test(d.type || '') ? 'image' : 'file'; }
function cDocs() {
  const d = D(), docs = [...d.docs].sort((a, b) => b.date.localeCompare(a.date)).slice(0, 4);
  return `<section class="card s6">${illus('file', 's')}<div class="ch"><span class="ttl">Documentos</span></div>
  ${docs.length ? `<div class="lbl mt12">${d.docs.length} documento${d.docs.length > 1 ? 's' : ''} guardado${d.docs.length > 1 ? 's' : ''}</div><div class="list mt8">${docs.map(x => `<div class="li clk" data-act="previewDoc" data-id="${x.id}"><div class="ico">${ic(docIcon(x))}</div><div class="n ellip">${esc(x.name)}<small>${esc(x.cat)} · ${fdate(x.date)}</small></div></div>`).join('')}</div><div class="rowf mt12"><button class="btn sm" data-act="nav" data-p="docs">Ver documentos ${ic('right', 's')}</button></div>` : emptyBox('file', 'Nenhum documento', 'Guarde contratos, comprovantes e exames em um só lugar.', 'Novo documento', 'add', 'data-v="doc"')}</section>`;
}
function vHome() {
  const b = budget(S.ym);
  return `<div class="grid dash">${cSaldo(b)}${cPagar(b)}${cOrcamento(b)}${cCartoes()}${cObra()}${cAptoMini()}${cFitness()}${cMetas()}${cAgenda()}${cDocs()}</div>`;
}

const delBtn = (t, id) => `<button class="ib" data-act="del" data-t="${t}" data-id="${id}" aria-label="Excluir">${ic('trash', 's')}</button>`;
const editBtn = (a, id) => `<button class="ib" data-act="${a}" data-id="${id}" aria-label="Editar">${ic('pencil', 's')}</button>`;
const pageHead = (title, sub, right = '') => `<div class="rowf wrap between" style="padding:2px 2px 0"><div><div class="md2">${title}</div><div class="lbl">${sub}</div></div><div class="rowf wrap">${right}</div></div>`;

/* ---------- FINANÇAS ---------- */
function statusPill(i) {
  if (i.type === 'in') return `<span class="pill ${i.paid ? 'gr' : ''}">${i.paid ? 'Recebida' : 'A receber'}</span>`;
  return i.paid ? '<span class="pill gr">Paga</span>' : i.over ? '<span class="pill rd">Atrasada</span>' : '<span class="pill am">Pendente</span>';
}
function vFin() {
  const b = budget(S.ym), d = D();
  let rows = b.items.slice();
  if (S.finTab === 'in') rows = rows.filter(i => i.type === 'in');
  if (S.finTab === 'out') rows = rows.filter(i => i.type === 'out');
  if (S.finTab === 'pend') rows = rows.filter(i => i.type === 'out' && !i.paid);
  if (S.finTab === 'paid') rows = rows.filter(i => i.paid);
  if (S.finCat) rows = rows.filter(i => i.cat === S.finCat);
  if (S.finQ) rows = rows.filter(i => i.desc.toLowerCase().includes(S.finQ.toLowerCase()));
  const tabs = [['all', 'Todos'], ['in', 'Receitas'], ['out', 'Saídas'], ['pend', 'Pendentes'], ['paid', 'Pagas']];
  const tr = rows.map(i => {
    const c = catOf(i.cat), edit = i.kind === 'tx' ? 'editItem' : i.kind === 'card' ? 'editCard' : 'editParc';
    return `<tr><td style="width:44px"><button class="chk ${i.paid ? 'on' : ''}" data-act="pay" data-k="${esc(i.key)}" aria-label="Alternar pagamento">${ic('check')}</button></td><td class="tnum mu" style="width:46px">${pad(i.day)}</td>
    <td><b class="fw6">${esc(i.desc)}</b>${i.kind === 'tx' && i.rec ? '<div class="xs mu">Todo mês</div>' : i.kind === 'card' ? '<div class="xs mu">Fatura do cartão</div>' : i.kind === 'apt' ? '<div class="xs mu">Parcela do apartamento</div>' : ''}</td>
    <td><span class="rowf" style="gap:7px"><span class="dot" style="background:${c.color}"></span>${esc(c.name)}</span></td><td>${statusPill(i)}</td>
    <td class="r tnum fw6" style="color:${i.type === 'in' ? 'var(--gr)' : 'var(--tx)'}">${i.type === 'in' ? '+' : '−'} ${R(i.val)}</td>
    <td class="r"><div class="actions"><button class="ib" data-act="${edit}" data-id="${i.id}" data-k="${esc(i.key)}" aria-label="Editar">${ic('pencil', 's')}</button>${i.kind === 'tx' ? delBtn('tx', i.id) : ''}</div></td></tr>`;
  }).join('');
  const trend = Array.from({ length: 6 }, (_, i) => { const ym = ymAdd(S.ym, i - 5), x = budget(ym); return { l: MON3[+ym.slice(5) - 1], a: x.inc, b: x.spent, cur: i === 5 }; });
  const cats = {};
  b.outs.forEach(i => { const o = cats[i.cat] || (cats[i.cat] = { c: catOf(i.cat), v: 0 }); o.v += i.val; });
  const cl = Object.values(cats).sort((a, c) => c.v - a.v);
  return `<div class="grid">${cSaldo(b, 's8')}
  <section class="card s4">${illus('shield', 'v')}<div class="ch"><span class="ttl">Reserva</span></div><div class="lbl mt12">Saldo acumulado</div><div class="mt4">${bigMoney(reserveBal(), 'mid tnum')}</div><div class="lbl mt8">${R(b.g.reserva)} reservados em ${MONTHS[+S.ym.slice(5) - 1].toLowerCase()}</div><div class="grow"></div><div class="rowf mt16"><button class="btn sm" data-act="reserve">Ajustar saldo inicial</button></div></section>
  <section class="card s12"><div class="rowf wrap between mb8"><span class="ttl">Lançamentos de ${MONTHS[+S.ym.slice(5) - 1].toLowerCase()}</span><div class="rowf wrap"><button class="btn sm" data-act="add" data-v="bill">${ic('plus', 's')} Nova conta</button><button class="btn sm pri" data-act="add" data-v="tx">${ic('plus', 's')} Novo lançamento</button></div></div>
  <div class="rowf wrap between mt8"><div class="tabs" style="max-width:100%;overflow-x:auto">${tabs.map(([k, l]) => `<button class="${S.finTab === k ? 'on' : ''}" data-act="finTab" data-v="${k}">${l}</button>`).join('')}</div>
   <div class="rowf wrap"><select class="inp" style="width:auto;padding:7px 32px 7px 12px" data-act="finCat" aria-label="Filtrar categoria"><option value="">Todas as categorias</option>${d.cats.map(c => `<option value="${c.id}" ${S.finCat === c.id ? 'selected' : ''}>${esc(c.name)}</option>`).join('')}</select><label class="search"><span>${ic('search', 's')}</span><input id="finQ" placeholder="Buscar lançamento" value="${esc(S.finQ)}"></label></div></div>
  ${rows.length ? `<div class="tbl-w mt12"><table class="tbl"><thead><tr><th></th><th>Dia</th><th>Descrição</th><th>Categoria</th><th>Status</th><th class="r">Valor</th><th></th></tr></thead><tbody>${tr}</tbody></table></div>` : `<div class="mt12">${emptyBox('receipt', b.items.length ? 'Nada encontrado' : 'Nenhum lançamento neste mês', b.items.length ? 'Ajuste os filtros para ver outros lançamentos.' : 'Cadastre sua renda, contas e despesas.', b.items.length ? '' : 'Novo lançamento', 'add', 'data-v="tx"')}</div>`}</section>
  <section class="card s8"><div class="ch"><span class="ttl">Últimos 6 meses</span><span class="grow"></span><span class="xs mu rowf"><span class="dot" style="background:var(--g-sobra)"></span> Receitas <span class="dot" style="background:var(--bl);margin-left:8px"></span> Saídas</span></div><div class="mt12">${trend.some(t => t.a || t.b) ? dualChart(trend) : emptyBox('trend', 'Sem histórico ainda', 'Os gráficos aparecem conforme você registra lançamentos.')}</div></section>
  <section class="card s4"><div class="ch"><span class="ttl">Gastos por categoria</span></div><div class="mt8">${cl.length ? cl.slice(0, 7).map(r => `<div class="cat-row" style="flex-wrap:wrap"><span class="sq" style="background:${r.c.color}"></span>${esc(r.c.name)}<span class="v">${R(r.v)}</span><div style="flex-basis:100%">${pbar(b.spent ? r.v / b.spent * 100 : 0)}</div></div>`).join('') : emptyBox('tag', 'Sem despesas', 'Nenhuma saída neste mês.')}</div></section></div>`;
}

/* ---------- MINHA RENDA ---------- */
function vRenda() {
  const d = D(), ins = d.tx.filter(t => t.type === 'in'), b = budget(S.ym);
  const recur = sum(ins.filter(t => t.rec && (!t.end || t.end >= curYM())).map(t => t.val));
  const tr = ins.sort((a, c) => a.date.localeCompare(c.date)).map(t => `<tr><td><b class="fw6">${esc(t.desc)}</b></td><td><span class="rowf" style="gap:7px"><span class="dot" style="background:${catOf(t.cat).color}"></span>${esc(catOf(t.cat).name)}</span></td><td>${t.rec ? `Todo mês · dia ${+t.date.slice(8)}` : 'Única · ' + fdate(t.date)}</td><td class="mu">${t.rec ? 'desde ' + ymLabel(t.date.slice(0, 7)) + (t.end ? ' até ' + ymLabel(t.end) : '') : ''}</td><td class="r tnum fw6 pos">${R(t.val)}</td><td class="r"><div class="actions">${editBtn('editItem', t.id)}${delBtn('tx', t.id)}</div></td></tr>`).join('');
  return `<div class="grid">

function vAgenda() {

const addMonthsISO = (iso, n) => { const ym = ymAdd(iso.slice(0, 7), n); return ym + '-' + pad(Math.min(+iso.slice(8), daysIn(ym))); };

/* ---- lançamentos / contas / renda ---- */
function txForm({ id = null, type = 'out', fixed = false, title, rec = false } = {}) {
  const d = D(), t = id ? d.tx.find(x => x.id === id) : null;
  if (id && !t) return;
  const ty = t ? t.type : type, lockType = fixed || !!t;
  const fields = [];
  if (!lockType) fields.push({ k: 'type', label: 'Tipo', type: 'select', opts: [['out', 'Despesa'], ['in', 'Receita']] });
  fields.push(
    { k: 'desc', label: 'Descrição', req: true, ph: ty === 'in' ? 'Ex.: Salário' : 'Ex.: Internet' },
    { k: 'val', label: 'Valor (R$)', type: 'money', pos: true, half: true },
    { k: 'date', label: ty === 'in' ? 'Data de recebimento' : 'Vencimento / data', type: 'date', req: true, half: true },
    { k: 'cat', label: 'Categoria', type: 'select', opts: ty === 'in' ? incCats() : expCats(), half: true },
    { k: 'rec', label: 'Repetição', type: 'select', opts: [['0', 'Só uma vez'], ['1', 'Todo mês']], half: true },
    { k: 'end', label: 'Repetir até (opcional)', type: 'month', hint: 'Deixe em branco para repetir sem fim.' },
  );
  if (!lockType && d.cards.length) fields.push({ k: 'card', label: 'Pago com', type: 'select', opts: [['', 'Débito, Pix ou dinheiro'], ...d.cards.map(c => [c.id, 'Cartão ' + c.name])] }, { k: 'n', label: 'Parcelas no cartão', type: 'number', half: true, hint: 'Valor total dividido em parcelas iguais.' });
  const vals = t ? { ...t, val: t.val, rec: t.rec ? '1' : '0' } : { type: ty, date: defDate(), rec: rec ? '1' : '0', cat: ty === 'in' ? 'salario' : '', n: 1 };
  openForm({
    title: title || (t ? 'Editar lançamento' : 'Novo lançamento financeiro'), sub: t && t.rec ? 'A alteração vale para todos os meses deste lançamento.' : '',
    fields, values: vals, submit: t ? 'Salvar alterações' : 'Salvar',
    setup(form) {
      const sync = () => {
        const tp = lockType ? ty : form.querySelector('#f_type').value, sel = form.querySelector('#f_cat'), cur = sel.value;
        sel.innerHTML = optsHTML(tp === 'in' ? incCats() : expCats(), cur); if (![...sel.options].some(o => o.value === cur)) sel.selectedIndex = 0;
        const card = form.querySelector('#f_card'); const useCard = card && card.value && tp === 'out';
        showFld(form, 'card', tp === 'out'); showFld(form, 'n', !!useCard); showFld(form, 'rec', !useCard); showFld(form, 'end', !useCard && form.querySelector('#f_rec').value === '1');
      };
      ['type', 'card', 'rec'].forEach(k => { const el = form.querySelector('#f_' + k); el && el.addEventListener('change', sync); }); sync();
    },
    onSubmit(v) {
      const tp = lockType ? ty : v.type;
      if (v.card && !t && tp === 'out') { d.buys.push({ id: uid(), card: v.card, desc: v.desc, val: v.val, date: v.date, n: Math.max(1, Math.round(v.n || 1)), cat: v.cat }); commit('Compra lançada no cartão'); return; }
      const rec = v.rec === '1', o = { type: tp, desc: v.desc, val: v.val, date: v.date, cat: v.cat, rec, end: rec ? (v.end || '') : '' };
      if (t) Object.assign(t, o); else d.tx.push({ id: uid(), paid: {}, ...o });
      if (o.date.slice(0, 7) !== S.ym && !rec) S.ym = o.date.slice(0, 7);
      commit(t ? 'Lançamento atualizado' : tp === 'in' ? 'Renda salva' : 'Lançamento salvo');
    },
    onDelete: t ? () => delThing('tx', id) : null,
  });
}

  buy: { l: 'compra', arr: d => d.buys, t: 'Excluir compra?', x: 'A compra (e suas parcelas) sai das faturas.' },

  body: { l: 'medição', arr: d => d.body, t: 'Excluir medição?', x: 'Esta ação não pode ser desfeita.' },
  event: { l: 'evento', arr: d => d.events, t: 'Excluir evento?', x: 'Esta ação não pode ser desfeita.' },
  goal: { l: 'meta', arr: d => d.goals, t: 'Excluir meta?', x: 'Esta ação não pode ser desfeita.' },
  doc: { l: 'documento', arr: d => d.docs, t: 'Excluir documento?', x: 'O arquivo será removido deste aparelho.' },
  cat: { l: 'categoria', arr: d => d.cats, t: 'Excluir categoria?', x: 'Lançamentos que usam esta categoria passarão para "Outros".' },
};
async function delThing(t, id) {
  const m = DEL[t], d = D();
  if (t === 'cat' && ['outros', 'cartao', 'apartamento', 'outras-rendas'].includes(id)) { toast('Esta categoria é do sistema e não pode ser excluída.', 'err'); return; }
  if (!await confirmBox({ title: m.t, text: m.x })) return;
  const arr = m.arr(d), i = arr.findIndex(x => x.id === id); if (i < 0) return;
  arr.splice(i, 1);
  if (t === 'card') d.buys = d.buys.filter(b => b.card !== id);
  if (t === 'doc') Files.del(id);
  if (t === 'cat') { d.tx.forEach(x => { if (x.cat === id) x.cat = x.type === 'in' ? 'outras-rendas' : 'outros'; }); d.buys.forEach(x => { if (x.cat === id) x.cat = 'outros'; }); }
  $('#dlg').open && $('#dlg').close();
  commit('Removido com sucesso');
}

  drawer: () => document.body.classList.toggle('drawer'),
  theme: el => { setTheme(el.dataset.v); render(); },
  enterDemo, exitDemo,
  month: el => { S.ym = ymAdd(S.ym, +el.dataset.v); S.payDay = null; S.invOff = 0; S.calSel = null; S.menu = null; render(); },
  menu: el => { S.menu = S.menu === el.dataset.v ? null : el.dataset.v; renderTop(); },
  pickYear: el => { S.ym = ymAdd(S.ym, 12 * +el.dataset.v); renderTop(); },
  pickMonth: el => { const v = el.dataset.v; S.ym = v === 'today' ? curYM() : S.ym.slice(0, 5) + pad(+v + 1); S.menu = null; S.payDay = null; S.invOff = 0; S.calSel = null; render(); },
  add: el => { S.menu = null; renderTop(); (ADD[el.dataset.v] || ADD.tx)(); },
  addIncome: () => txForm({ type: 'in', fixed: true, rec: true, title: 'Nova renda' }),
  pay: el => {
    const key = el.dataset.k;
    if (key.startsWith('a:')) { const p = D().apt.parc.find(x => x.id === key.slice(2)); if (!p) return; setPaid({ kind: 'apt', id: p.id }, !p.paid); commit(p.paid ? 'Parcela marcada como paga' : 'Parcela reaberta'); return; }
    const it = itemByKey(key); if (!it) return;
    setPaid(it, !it.paid); commit(!it.paid ? (it.type === 'in' ? 'Receita marcada como recebida' : 'Conta marcada como paga') : 'Marcada como pendente');
  },
  editItem: el => {
    const k = el.dataset.k;
    if (k && !el.dataset.id) { const [kind, id] = [k[0], k.slice(2)]; if (kind === 't') txForm({ id }); else if (kind === 'c') cardForm(id); else if (kind === 'a') parcForm(id); return; }
    if (el.dataset.id) { const k2 = k || ''; if (k2.startsWith('c:')) return cardForm(el.dataset.id); if (k2.startsWith('a:')) return parcForm(el.dataset.id); txForm({ id: el.dataset.id }); }
  },
  payDay: el => { S.payDay = el.dataset.v === '' ? null : +el.dataset.v; render(); },
  reserve: reserveForm, aptInfo: aptInfoForm, weekGoal: weekGoalForm, editProfile: profileForm,
  invOff: el => { S.invOff = +el.dataset.v; render(); },
  editCard: el => cardForm(el.dataset.id), newBuy: el => buyForm({ card: el.dataset.id || '' }), editBuy: el => buyForm({ id: el.dataset.id }),
  togInv: el => { const c = D().cards.find(x => x.id === el.dataset.id); c.paid = c.paid || {}; if (c.paid[S.ym]) delete c.paid[S.ym]; else c.paid[S.ym] = true; commit(c.paid[S.ym] ? 'Fatura marcada como paga' : 'Fatura reaberta'); },
  viewInvoice: () => { S.ym = ymAdd(S.ym, S.invOff); S.invOff = 0; go('cartoes'); },
  scrollCards: el => { const r = $('#ccRow'); if (r && r.firstElementChild) r.scrollBy({ left: +el.dataset.v * (r.firstElementChild.offsetWidth + 14), behavior: 'smooth' }); },
  editParc: el => parcForm(el.dataset.id), editObra: el => obraForm(el.dataset.id),
  parcF: el => { S.parcF = el.dataset.v; render(); },
  editGoal: el => goalForm(el.dataset.id), bumpGoal: el => bumpGoal(el.dataset.id), goalF: el => { S.goalF = el.dataset.v; render(); },
  editEvent: el => eventForm({ id: el.dataset.id }), newEventOn: el => eventForm({ date: el.dataset.v }),
  calDay: el => { S.calSel = el.dataset.v; render(); }, calCat: el => { S.calCat = el.dataset.v; render(); },
  editWorkout: el => workoutForm({ id: el.dataset.id }), editBody: el => bodyForm(el.dataset.id), editPlan: el => planForm(el.dataset && el.dataset.id || null),
  planDo: el => { const p = D().plan.find(x => x.id === el.dataset.id); if (p) workoutForm({ preset: { type: 'musculacao', date: todayISO(), name: p.name, ex: p.ex.map(e => ({ ...e })) } }); },
  finTab: el => { S.finTab = el.dataset.v; render(); },
  editCat: el => catForm(el.dataset && el.dataset.id || null), editBuyDummy: () => { },
  newDoc: el => newDocForm(el.dataset.cat || ''), previewDoc: el => previewDoc(el.dataset.id), dlDoc: el => dlDoc(el.dataset.id), editDoc: el => editDocForm(el.dataset.id),
  docCat: el => { S.docCat = el.dataset.v; render(); }, goDocs: el => { S.docCat = el.dataset.cat || ''; go('docs'); },
  del: el => delThing(el.dataset.t, el.dataset.id),
  exportData, importData: () => $('#impIn').click(), wipe: wipeForm,
  goLogin: () => Gate.show('login'), logout: () => Cloud.logout(),
};

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (S.menu && !e.target.closest('[data-menu]') && !(el && el.dataset.act === 'menu')) { S.menu = null; renderTop(); if (!el) return; }
  if (!el || el.tagName === 'SELECT') return;
  const f = ACT[el.dataset.act]; if (!f) return;
  if (el.closest('.li') && el.classList.contains('chk')) e.stopPropagation();
  f(el, e);
});
document.addEventListener('change', e => {
  const el = e.target.closest('select[data-act]');
  if (el && el.dataset.act === 'finCat') { S.finCat = el.value; render(); }
});
let _qt;
document.addEventListener('input', e => {
  const id = e.target.id;
  if (id === 'finQ' || id === 'docQ') {
    const v = e.target.value; clearTimeout(_qt);
    _qt = setTimeout(() => { if (id === 'finQ') S.finQ = v; else S.docQ = v; render(); const n = $('#' + id); if (n) { n.focus(); n.setSelectionRange(v.length, v.length); } }, 220);
  }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { if (S.menu) { S.menu = null; renderTop(); } document.body.classList.remove('drawer'); }
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('.cc')) { e.preventDefault(); e.target.click(); }
});
$('#impIn').addEventListener('change', e => { importData(e.target.files[0]); e.target.value = ''; });
window.addEventListener('resize', debounce(() => { if (innerWidth > 1100) document.body.classList.remove('drawer'); }, 150));

/* =====================================================================
   NUVEM (Firebase) — só sincroniza o contexto REAL
   ===================================================================== */
const FB = {
  apiKey: "AIzaSyB8QIdyNM9H5ccxjQKeM6VVt52_wHL0CDw", authDomain: "financas-50983.firebaseapp.com", projectId: "financas-50983",
  storageBucket: "financas-50983.firebasestorage.app", messagingSenderId: "839120116750", appId: "1:839120116750:web:1c5adafb70a9e6868bb05f",
};
const Cloud = {
  m: null, auth: null, db: null, storage: null, uid: null, timer: null, started: false,
  async init() {
    if (this.started) return; this.started = true;
    try {
      const v = '10.12.2', base = `https://www.gstatic.com/firebasejs/${v}/`;
      const [app, au, fs, st] = await Promise.all(['firebase-app', 'firebase-auth', 'firebase-firestore', 'firebase-storage'].map(n => import(base + n + '.js')));
      this.m = { au, fs, st }; const a = app.initializeApp(FB);
      this.auth = au.getAuth(a); this.db = fs.getFirestore(a); try { this.storage = st.getStorage(a); } catch (e) { }
      au.onAuthStateChanged(this.auth, u => this.onUser(u));
    } catch (e) { console.warn('Firebase indisponível', e); S.cloud = 'off'; Gate.offline(); }
  },
  async onUser(u) {
    if (!u) { this.uid = null; S.cloud = 'off'; renderSide(); if (!UI.local) Gate.show('login'); return; }
    this.uid = u.uid; S.cloudUser = u.email || ''; Gate.msg('Sincronizando…', true);
    try { await this.pull(); S.cloud = 'on'; } catch (e) { console.warn(e); S.cloud = 'err'; toast('Não foi possível sincronizar. Usando dados deste aparelho.', 'err'); }
    UI.local = false; saveUI(); Gate.hide(); render(); if (S.page === 'config') render();
  },
  async pull() {
    const { doc, getDoc } = this.m.fs, ref = doc(this.db, 'users', this.uid), snap = await getDoc(ref);
    const raw = snap.exists() ? snap.data().vg : null; let cloud = null;
    try { cloud = raw ? JSON.parse(raw) : null; } catch (e) { }
    if (cloud) { const c = normalize(cloud); if (isEmptyData(Store.real) || (c.savedAt || 0) >= (Store.real.savedAt || 0)) Store.setReal(c); else await this.push(); }
    else if (!isEmptyData(Store.real)) await this.push();
  },
  queue() { if (!this.uid) return; clearTimeout(this.timer); this.timer = setTimeout(() => this.push(), 800); },
  async push() { // grava SEMPRE Store.real, nunca o contexto de demonstração; merge preserva campos antigos do documento
    if (!this.uid) return;
    try { const { doc, setDoc } = this.m.fs; await setDoc(doc(this.db, 'users', this.uid), { vg: JSON.stringify(Store.real), vgUpdated: Date.now() }, { merge: true }); S.cloud = 'on'; }
    catch (e) { S.cloud = 'err'; }
    renderSide();
  },
  async upload(path, blob) {
    if (!this.uid || !this.storage) return null;
    try { const { ref, uploadBytes, getDownloadURL } = this.m.st, r = ref(this.storage, 'vida/' + this.uid + '/' + path); await uploadBytes(r, blob); return await getDownloadURL(r); } catch (e) { return null; }
  },
  login(email, pw) { return this.m.au.signInWithEmailAndPassword(this.auth, email, pw); },
  reset(email) { return this.m.au.sendPasswordResetEmail(this.auth, email); },
  async logout() { try { await this.m.au.signOut(this.auth); } catch (e) { } this.uid = null; S.cloud = 'off'; UI.local = true; saveUI(); toast('Você saiu da nuvem. Os dados continuam neste aparelho.'); render(); },
};
const FBERR = { 'auth/invalid-credential': 'E-mail ou senha incorretos.', 'auth/wrong-password': 'E-mail ou senha incorretos.', 'auth/user-not-found': 'E-mail ou senha incorretos.', 'auth/invalid-email': 'E-mail inválido.', 'auth/too-many-requests': 'Muitas tentativas. Aguarde alguns minutos.', 'auth/unauthorized-domain': 'Este endereço não está autorizado no Firebase (Authentication › Settings › Authorized domains).', 'auth/network-request-failed': 'Sem conexão com a internet.' };

/* ---------- tela de entrada ---------- */
const Gate = {
  el: () => $('#gate'),
  show(kind) {
    const g = this.el(); g.classList.add('show');
    if (kind === 'loading') { g.innerHTML = `<div class="login" style="text-align:center"><div class="avatar" style="margin:0 auto 14px">G</div><div class="spin" style="margin:0 auto 14px"></div><div class="lbl" id="gmsg">Carregando…</div></div>`; return; }
    g.innerHTML = `<form class="login" id="loginForm" novalidate><div class="avatar">G</div><h2>Vida Gabriela</h2><p class="s">Entre para sincronizar seus dados entre aparelhos.</p>
      <div class="fld"><label for="lu">E-mail</label><input class="inp" id="lu" type="email" autocomplete="username" autocapitalize="none"></div>
      <div class="fld"><label for="lp">Senha</label><input class="inp" id="lp" type="password" autocomplete="current-password"></div>
      <div class="msg" id="gmsg" aria-live="polite"></div>
      <button class="btn pri blk" style="padding:11px" type="submit">Entrar</button>
      <button class="btn gh blk mt8" type="button" id="gReset">Esqueci a senha</button><hr class="sep">
      <button class="btn blk" type="button" id="gLocal">Usar somente neste aparelho</button></form>`;
    $('#loginForm').onsubmit = async e => {
      e.preventDefault(); const em = $('#lu').value.trim(), pw = $('#lp').value;
      if (!em || !pw) return this.msg('Preencha e-mail e senha.');
      this.msg('Entrando…', true);
      try { await Cloud.login(em, pw); } catch (x) { this.msg(FBERR[x && x.code] || 'Não foi possível entrar: ' + ((x && x.code) || x)); }
    };
    $('#gReset').onclick = async () => { const em = $('#lu').value.trim(); if (!em) return this.msg('Digite seu e-mail primeiro.'); try { await Cloud.reset(em); this.msg('Enviamos um link de redefinição para o seu e-mail.', true); } catch (x) { this.msg(FBERR[x && x.code] || 'Erro ao enviar o e-mail.'); } };
    $('#gLocal').onclick = () => { UI.local = true; saveUI(); this.hide(); render(); };
  },
  msg(t, ok) { const m = $('#gmsg'); if (m) { m.textContent = t; m.classList.toggle('ok', !!ok); } },
  hide() { this.el().classList.remove('show'); this.el().innerHTML = ''; },
  offline() { if (!UI.local) { this.show('login'); this.msg('Sem conexão com a nuvem. Você pode usar o app somente neste aparelho.'); } },
};

/* =====================================================================
   BOOT
   ===================================================================== */
(function boot() {
  setTheme(UI.theme || 'light');
  S.loading = true; render();
  if (!UI.local) Gate.show('loading');
  setTimeout(() => { S.loading = false; render({ anim: true }); }, 450);
  Cloud.init();
  if (!UI.local) setTimeout(() => { if (Gate.el().classList.contains('show') && !Cloud.uid && !$('#loginForm')) Gate.offline(); }, 7000);
  // nunca permitir que o contexto de demonstração persista entre sessões
  window.addEventListener('pagehide', () => { if (Store.mode === 'demo') { Store.demo = null; Store.mode = 'real'; } });
})();
</script>
